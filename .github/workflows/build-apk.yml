name: Build HamMasir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'app/**'
      - 'core/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Bundle app.js → app.bundle.js
        run: |
          esbuild app/app.js --bundle --format=iife --target=es2020 --outfile=app/app.bundle.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Copy web assets into Android project
        run: |
          set -e
          ASSETS="android/app/src/main/assets"
          mkdir -p "$ASSETS"
          cp app/index.html "$ASSETS/index.html"
          cp app/app.bundle.js "$ASSETS/app.bundle.js"
          ls -la "$ASSETS"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamMasir-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
