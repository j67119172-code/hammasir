<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F6B67">
<title>هم‌مسیر</title>
 <style> 
  .upload{border:1.5px dashed #bfd0d9;border-radius:16px;padding:12px;text-align:center;background:#f8fbfc}
.upload input[type=file]{display:none}
.photo{width:86px;height:86px;border-radius:23px;margin:0 auto 8px;background:#edf2f5;display:grid;place-items:center;overflow:hidden;font-size:28px}
.photo img{width:100%;height:100%;object-fit:cover}
.timepick{display:flex;align-items:center;gap:5px;margin-top:5px}
.timepick select{flex:1;margin:0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:10px;color:#4a5666;line-height:1.8;margin:8px 0}
.check input{margin-top:3px;accent-color:#0f6b67;flex:none}
.weekday-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0}
.weekday-btn{padding:9px 2px;border:1px solid #dce6ec;background:#fff;border-radius:10px;font-size:11px;font-family:inherit;cursor:pointer;text-align:center;color:#6b798c}
.weekday-btn.active{background:#0f6b67;color:#fff;border-color:#0f6b67;font-weight:700}
.map-picker{position:relative;height:180px;touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid #cddae5;border-radius:18px;overflow:hidden;cursor:crosshair;margin-top:6px;background-color:#eef5ef;background-image:linear-gradient(28deg,transparent 46%,rgba(255,255,255,.95) 47%,rgba(255,255,255,.95) 52%,transparent 53%),linear-gradient(118deg,transparent 44%,rgba(255,255,255,.9) 45%,rgba(255,255,255,.9) 50%,transparent 51%),linear-gradient(0deg,rgba(18,107,104,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,107,104,.06) 1px,transparent 1px);background-size:100% 100%,100% 100%,28px 28px,28px 28px}
.map-picker:before{content:'روی محل دلخواه ضربه بزن';position:absolute;right:10px;top:9px;background:rgba(255,255,255,.9);padding:5px 8px;border-radius:10px;font-size:9px;color:#6b798c;z-index:2}
.map-marker{position:absolute;width:22px;height:22px;border-radius:50% 50% 50% 0;background:#0f6b67;transform:translate(-50%,-100%) rotate(-45deg);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.map-marker:after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;left:7px;top:7px}

:root{--p:#0f6b67;--p2:#0a4f4c;--bg:#f4f8fa;--card:#fff;--txt:#142236;--mut:#6b798c;--line:#dce6ec;--ok:#16825f;--warn:#9b641d;--danger:#a43f45;--shadow:0 14px 38px rgba(18,39,58,.10)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:var(--txt);background:linear-gradient(145deg,#eaf7f6,#f7fafc 58%,#fff5e9)}
button,input,select,textarea{font-family:inherit}
.shell{max-width:450px;min-height:100vh;margin:auto;background:rgba(255,255,255,.84);box-shadow:0 0 60px rgba(0,0,0,.08);padding-bottom:92px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px}
.brand b{font-size:18px}
.brand small{display:block;color:var(--mut);font-size:9px;margin-top:2px}
.mark{width:48px;height:48px;border-radius:16px;background:#e5f4f2;display:grid;place-items:center}
.mark svg{width:40px;height:40px}
.step{font-size:9px;color:var(--mut);border:1px solid var(--line);background:#f7f9fb;padding:7px 8px;border-radius:11px}
main{padding:18px 15px}
.hero h1{font-size:23px;line-height:1.55;margin:0 0 7px}
.hero p{font-size:11.5px;line-height:1.95;color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:14px;margin:0 0 8px}
.card p{font-size:10.5px;color:var(--mut);line-height:1.9;margin:0}
.sub{font-size:10px;color:var(--mut)}
.sep{height:1px;background:var(--line);margin:13px 0}
label{display:block;font-size:10px;color:var(--mut);margin:11px 0 6px}
.input,select,textarea{width:100%;border:1px solid var(--line);background:#fbfdff;border-radius:13px;padding:11px 12px;font-size:12px;outline:none}
.input:focus,select:focus,textarea:focus{border-color:#76b6b2;box-shadow:0 0 0 3px rgba(15,107,103,.08)}
textarea{min-height:76px;resize:vertical}
.btn{width:100%;border:0;border-radius:14px;padding:11px 12px;margin-top:10px;background:var(--p);color:#fff;font-weight:700;font-size:11px;cursor:pointer}
.btn.secondary{background:#edf8f7;color:var(--p);border:1px solid #cce7e4}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:#fff2f2;color:var(--danger);border:1px solid #efcccc}
.btn.small{width:auto;margin:0;padding:7px 9px;border-radius:11px;font-size:9px}
.btn:disabled{opacity:.45}
.back{width:36px;height:36px;border:0;border-radius:11px;background:#eff4f6;font-size:17px;cursor:pointer;margin-bottom:10px}
.row{display:flex;align-items:center;gap:9px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.notice{font-size:10px;line-height:1.95;border-radius:14px;padding:10px 11px;margin:10px 0;background:#eef8f7;border:1px solid #d2ebe8;color:#285d59}
.notice.blue{background:#eef5ff;border-color:#d7e4f7;color:#365b90}
.notice.orange{background:#fff6e9;border-color:#f0deb9;color:#81551f}
.notice.red{background:#fff1f1;border-color:#efcccc;color:#913d43}
.notice.gray{background:#f5f7f9;border-color:#e1e7ec;color:#59687b}
.badge{font-size:8.5px;padding:5px 7px;border-radius:999px;background:#f0f3f6;color:#627185;white-space:nowrap}
.badge.ok{background:#e8f7f1;color:var(--ok)}
.badge.pending{background:#fff3e4;color:#a86513}
.badge.info{background:#eaf1ff;color:#516aa5}
.member{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.member:last-child{border-bottom:0}
.avatar{width:42px;height:42px;border-radius:13px;background:#eaf1f4;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.meta{min-width:0;flex:1}
.meta b{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{font-size:9px;line-height:1.7;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.otp{display:flex;gap:5px;justify-content:center;direction:ltr;margin:14px 0}
.otp input{width:42px;height:48px;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:18px;font-weight:800}
.bottom{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(450px,100%);display:flex;justify-content:space-around;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 5px calc(9px + env(safe-area-inset-bottom))}
.nav{border:0;background:transparent;color:#7a8798;font-size:8.5px;cursor:pointer;padding:3px 8px}
.nav span{font-size:18px;display:block;margin-bottom:2px}
.nav.active{color:var(--p);font-weight:700}
.hidden{display:none!important}
.center{text-align:center;padding:40px 20px;color:var(--mut)}
.spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 100 100"><g fill="none" stroke="#0f6b67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="37" y="39" width="26" height="18" rx="5" fill="#fff"/><circle cx="43" cy="60" r="4" fill="#0f6b67"/><circle cx="57" cy="60" r="4" fill="#0f6b67"/><path d="M41 39l5-8h9l5 8"/></g></svg>
      </div>
      <div><b>هم‌مسیر</b><small>هماهنگی گروهی دارندگان خودرو</small></div>
    </div>
    <div id="step" class="step">شروع</div>
  </header>
  <main id="app"></main>
  <footer id="footer" class="bottom hidden">
    <button id="nHome" class="nav" onclick="app.nav('home')"><span>🏠</span>خانه</button>
    <button id="nGroup" class="nav" onclick="app.nav('group')"><span>👥</span>گروه من</button>
    <button id="nMsg" class="nav" onclick="app.nav('msg')"><span>💬</span>پیام‌ها</button>
    <button id="nProfile" class="nav" onclick="app.nav('profile')"><span>👤</span>پروفایل</button>
  </footer>
</div>
<script>
window.HAMMASIR_API_URL = 'https://hammasir-1.onrender.com';
</script>
<script>
window.onerror = function(msg, src, line) {
  document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;font-size:18px;direction:ltr;z-index:9999">ERROR: ' + msg + ' line ' + line + '</div>';
};
   </script> 
<script src="app.bundle.js"></script>
</body>
</html>
